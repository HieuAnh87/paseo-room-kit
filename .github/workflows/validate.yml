name: validate

on:
  push:
  pull_request:

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate portable kit
        run: ./scripts/doctor.sh --repo
      - name: Validate public export contract
        run: python3 tests/test_public_export.py
      - name: Validate doctor environment checks
        run: python3 tests/test_doctor.py
      - name: Validate installer behavior
        run: python3 tests/test_install.py
  plugins:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [plugin, callback-plugin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - name: Install plugin dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci --ignore-scripts
      - name: Test plugin
        working-directory: ${{ matrix.directory }}
        run: npm test
      - name: Typecheck plugin
        working-directory: ${{ matrix.directory }}
        run: npm run typecheck
